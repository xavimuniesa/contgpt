<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centre de Comandament Espacial - Mòbil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-dark: #030508;
            --panel-bg: rgba(10, 15, 26, 0.85);
            --panel-border: rgba(0, 240, 255, 0.25);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-amber: #ffb700;
            --text-main: #e0f2fe;
            --text-dim: #7dd3fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* alçada real a Safari iOS, tenint en compte les barres */
            overflow: hidden;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(10, 30, 60, 0.4) 0%, rgba(3, 5, 8, 0.95) 100%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 6px;
            padding-top: env(safe-area-inset-top, 6px);
            padding-bottom: env(safe-area-inset-bottom, 6px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .space-screens {
            flex: 3;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .telemetry-panels {
            flex: 2;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
        }

        .screen-card, .telemetry-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.03);
            overflow: hidden;
            text-align: center;
        }

        .screen-card {
            flex: 1;
            min-height: 0;
        }

        .telemetry-card {
            min-height: 0;
        }

        .screen-card::before, .telemetry-card::before {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 5px; height: 5px;
            border-top: 1.5px solid var(--neon-blue);
            border-left: 1.5px solid var(--neon-blue);
        }

        .screen-card::after, .telemetry-card::after {
            content: '';
            position: absolute;
            bottom: 3px; right: 3px;
            width: 5px; height: 5px;
            border-bottom: 1.5px solid var(--neon-blue);
            border-right: 1.5px solid var(--neon-blue);
        }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 3px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--neon-blue);
            letter-spacing: 0.5px;
            text-align: left;
            text-transform: uppercase;
        }

        .card-coords {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-dim);
            text-align: right;
        }

        .canvas-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .badge-info {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue);
            padding: 2px 6px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.2);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .gauge-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.5rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
        }

        .gauge-value-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 2px;
            margin: auto 0;
            width: 100%;
        }

        .gauge-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px var(--neon-blue);
            line-height: 1;
        }

        .gauge-unit {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: var(--neon-blue);
        }

        .meter-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 2px 0;
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            width: 50%;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 4px var(--neon-blue);
        }

        .sub-status-text {
            font-size: 0.5rem;
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            width: 100%;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.5rem;
            color: var(--text-dim);
            padding: 2px 4px 0 4px;
            flex-shrink: 0;
        }

        @media (orientation: landscape) {
            .dashboard-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                height: 100%;
            }

            .space-screens {
                flex: unset;
                display: flex;
                flex-direction: column;
                gap: 6px;
                height: 100%;
                min-height: 0;
            }

            .telemetry-panels {
                flex: unset;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 6px;
                height: 100%;
                min-height: 0;
            }

            .screen-card {
                flex: 1;
                min-height: 0;
                padding: 4px 6px;
            }

            .telemetry-card {
                height: 100%;
                min-height: 0;
                padding: 4px 6px;
            }

            .gauge-value {
                font-size: 1.1rem;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="space-screens">
            
            <div class="screen-card">
                <div class="card-header">
                    <span class="card-title" id="earth-card-title">PLANETA TERRA</span>
                    <span class="card-coords" id="earth-coords">41.38° N, 2.16° E</span>
                </div>
                <div class="canvas-container" id="earth-canvas-container"></div>
                <div class="badge-info" id="earth-status">FOSCOR / CLAROR</div>
            </div>

            <div class="screen-card">
                <div class="card-header">
                    <span class="card-title">LLUNA</span>
                    <span class="card-coords" id="moon-percent-text">--.-%</span>
                </div>
                <div class="canvas-container" id="moon-canvas-container"></div>
                <div class="badge-info" id="moon-phase-name">CARREGANT...</div>
            </div>

        </div>

        <div class="telemetry-panels">
            
            <div class="telemetry-card">
                <div class="gauge-label">HORA LOCAL</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="time-val">--:--:--</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="time-meter" style="width: 0%;"></div>
                </div>
                <div class="sub-status-text" id="date-val">-- --- ----</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">TEMP. LOCAL</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="temp-val">--.-</span>
                    <span class="gauge-unit">°C</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="temp-meter" style="width: 50%;"></div>
                </div>
                <div class="sub-status-text" id="temp-status">SENSÒRICA TÈRMICA</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">ALTITUD</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="alt-val">0</span>
                    <span class="gauge-unit">m</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="alt-meter" style="width: 5%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-amber));"></div>
                </div>
                <div class="sub-status-text" id="alt-status">NIVELL DEL MAR</div>
            </div>

            <div class="telemetry-card">
                <div class="gauge-label">HUMITAT</div>
                <div class="gauge-value-container">
                    <span class="gauge-value" id="hum-val">--</span>
                    <span class="gauge-unit">%</span>
                </div>
                <div class="meter-bar">
                    <div class="meter-fill" id="hum-meter" style="width: 50%;"></div>
                </div>
                <div class="sub-status-text">HIGRÒMETRE</div>
            </div>

        </div>

    </div>

    <footer>
        <span>BARCELONA ORBITAL © 2026</span>
        <span id="location-name">LAT: 41.38° N | LON: 2.16° E</span>
    </footer>

    <script src="dashboard.js"></script>
</body>
</html>
